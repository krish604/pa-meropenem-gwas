[pytest]
# Collect from tests/ only, so a bare `pytest` is the same invocation as the
# documented `pytest tests`.
#
# Without this, collection walks the whole repository. It reaches `test_data/`
# and `SkillOpt/`, and an unrelated project's test suite failing to import is
# then reported as this repository's failure — which is worse than useless,
# because it trains you to ignore the errors.
#
# Note the boundary this does NOT draw: testpaths is about *collection*, not
# permission. `SkillOpt/` is untracked and out of scope, not this
# configuration's problem to solve. If it is committed later, it needs its own
# exclusion here, deliberately, at that point.
testpaths = tests

# Markers that carry meaning. An unregistered marker is only a warning, but a
# warning that appears in every run is a warning nobody reads.
markers =
    slow: end-to-end tests that clone a fixture cohort and run the pipeline
filterwarnings =
    ignore::DeprecationWarning
