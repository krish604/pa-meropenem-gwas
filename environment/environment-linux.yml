# =============================================================================
# Pinned environment - LARGE LINUX MACHINE (the full 15-stage analysis)
#
# The analysis machine runs the complete pipeline, so this file includes the two
# tools that cannot be installed in the laptop environment. The reasons differ:
#
#   panaroo=1.7.0   stage 7, pangenome
#     Noarch, so it is present everywhere, but UNSOLVABLE on osx-arm64 at any
#     version: it needs prokka, which needs either tbl2asn-forever (in no
#     channel) or a dead `perl =5.26.2` pin. Solves normally on linux-64.
#     NOTE: 1.7.0 is the linux-64 maximum. The anaconda.org `latest_version`
#     field reports 1.8.0, but that is the max across ALL platforms.
#
#   gubbins=3.4.1   stage 8, recombination filter (pulls mafft)
#     gubbins DOES have three osx-arm64 builds (3.4.3). They are all Python-3.10
#     only, so gubbins cannot coexist with the laptop's Python 3.11.16 - that is
#     the real constraint, not a missing build. The linux-64 maximum is 3.4.1,
#     which is a py310 build, so the same Python-version question applies here:
#     confirm the solve on the actual machine before relying on it.
#     NOTE: 3.4.3 is the osx-64/linux-aarch64 build; the linux-64 maximum is
#     3.4.1, again because `latest_version` spans all platforms.
#
# Create (on the Linux machine):
#   micromamba env create -f environment/environment-linux.yml
#
# The target subdir is linux-64 unless the machine reports otherwise; check
# with `uname -m` and confirm before creating.
#
# Every version here must be verified with a real dry-run solve against the
# target platform before use:
#   micromamba env create -f environment/environment-linux.yml --dry-run
#
# This file is the SPECIFICATION of the Linux environment. The reproducible
# lock file, which pins exact builds rather than versions, is produced in a
# later phase once the Linux run is actually prepared.
# =============================================================================

# =============================================================================
# SOLVE VERDICT - measured 2026-10-07, linux-64, micromamba 2.9.0
#
# THIS FILE DOES NOT SOLVE FOR linux-64 AS PINNED. Verified with exactly the
# dry-run check the header above requires:
#
#   micromamba create --dry-run --platform linux-64 -f environment/environment-linux.yml
#
# Two independent blockers, each isolated on its own. NO PIN HAS BEEN CHANGED:
# the pins are what makes the laptop result and the analysis result comparable,
# and relaxing one to make a solve go green would be inventing a version (AGENTS.md
# rule 1). Re-solving is a deliberate decision that has not been taken.
#
#   1. gubbins=3.4.1 has NO linux-64 build for Python 3.11.16.
#      Every published linux-64 build is Python 3.10 (`gubbins 3.4.1
#      py310pl5321h577a1d6_0`, `gubbins 3.4.3 py310hfc0ef84_1`), so under
#      python=3.11.16 the solver reports `gubbins =3.4.1 * does not exist`,
#      and a bare `gubbins` (any version) fails identically. The caveat in the
#      header above is therefore answered for this platform: the
#      Python-version question is not hypothetical here, it is the blocker.
#      Falling back to python=3.10 does not help - it trades this blocker for
#      matplotlib-base=3.11.2, networkx=3.6.1, scipy=1.17.1,
#      snakemake-minimal=9.27.0 and uvicorn=0.54.0, none of which exist for
#      py310 on linux-64.
#
#   2. samtools=0.1.19 cannot coexist with python=3.11.16.
#      0.1.19 requires `openssl >=1.1.0,<=1.1.1`; Python 3.11.16 brings
#      `openssl >=3.5.7`. The same pin solves cleanly next to python=3.10, and
#      modern samtools is not the problem: the core stack minus
#      gubbins/mlst/samtools/panaroo solves for linux-64 in 357 packages
#      (698 MB) and pulls samtools 1.23.1 along the way.
#
#   mlst=2.33.1 and panaroo=1.7.0 are ALSO reported as blockers of the full
#   file. Which of their own dependencies conflicts was not isolated, so no
#   claim is made about them beyond that observation.
#
# Evidence (regenerate any of these before trusting them):
#   .build/linux-ready.solve.linux-64.fresh-full.txt        the three blockers
#   .build/linux-ready.solve.linux-64.core-nopy3tools.txt   EXIT=0, 357 pkgs
#   .build/linux-ready.probe.gubbins-python311.txt          EXIT=1, no build
#   .build/linux-ready.probe.gubbins-anypy311.txt           EXIT=1, any version
#   .build/linux-ready.probe.samtools019-py311.txt          EXIT=1, openssl
#   .build/linux-ready.solve.linux-64.py310.txt             the py310 trade-off
#
# Solving FROM macOS additionally needs CONDA_OVERRIDE_GLIBC=2.31
# CONDA_OVERRIDE_LINUX=5.10, because glibc is a host-resolved virtual package
# and without them the solver reports every linux-only package as missing -
# which is what the original, un-overridden logs show. On the Linux host
# neither override is needed.
#
# Ordered steps, and what to do about this, are in docs/LINUX_RUN.md step 1.
# The machine overlay config/machines/linux.yaml records the same verdict and
# sets gubbins `available: false` as its consequence.
# =============================================================================

name: pa-amr

channels:
  - conda-forge
  - bioconda

# `defaults` is deliberately NOT a channel here. It resolves to
# repo.anaconda.com, which repeatedly failed DNS during the osx-arm64
# build of this environment, and every package below resolves from
# conda-forge or bioconda without it.

dependencies:
  # --- core pipeline --------------------------------------------------------
  # Same versions as environment/environment.yml. The scientific stack is
  # identical on both machines on purpose: a divergence between the laptop
  # result and the analysis result is exactly the failure that invalidates a
  # GWAS. Change these and the environments stop being comparable.
  - python=3.11.16
  - pyyaml=6.0.3
  - numpy=2.4.6
  - pandas=3.0.6
  - scipy=1.17.1
  - matplotlib-base=3.11.2
  - networkx=3.6.1
  - jinja2=3.1.6
  - pytest=9.1.1
  - pytest-cov=7.1.0

  # --- dashboard ------------------------------------------------------------
  - fastapi=0.141.1
  - uvicorn=0.54.0
  - psutil=7.2.2
  - httpx=0.28.1

  # --- workflow engine ------------------------------------------------------
  - snakemake-minimal=9.27.0

  # --- stage 1: validation --------------------------------------------------
  - seqkit=2.14.0

  # --- stage 2: annotation --------------------------------------------------
  - bakta=1.12.1

  # --- stage 3: MLST --------------------------------------------------------
  - mlst=2.33.1

  # --- stage 4: AMR detection ----------------------------------------------
  - ncbi-amrfinderplus=4.2.7

  # --- stage 5: virulence ---------------------------------------------------
  - blast=2.17.0

  # --- stage 6: variant calling --------------------------------------------
  - minimap2=2.31
  # See environment/environment.yml for the full explanation of why samtools
  # 0.1.19 is forced here by mlst, and why stage 6 must call variants through
  # bcftools rather than samtools.
  - samtools=0.1.19
  - bcftools=1.23.1
  - htslib=1.23.1

  # --- stage 7: pangenome ---------------------------------------------------
  # LAPTOP-UNAVAILABLE: unsolvable on osx-arm64 at any version (prokka's dead
  # tbl2asn-forever / perl 5.26.2 pins). 1.7.0 is the linux-64 maximum.
  - panaroo=1.7.0

  # --- stage 8: recombination filter ----------------------------------------
  # LAPTOP-UNAVAILABLE: has osx-arm64 builds, but only py39/py310 ones, which
  # cannot coexist with the laptop's Python 3.11.16. 3.4.1 is the linux-64
  # maximum and is also a py310 build - verify the solve on this machine.
  # Depends on mafft, which is also absent from environment/environment.yml.
  - gubbins=3.4.1
  - mafft=7.526

  # --- stage 9: phylogeny ---------------------------------------------------
  - iqtree=3.1.3

  # --- stage 10: core SNP calling ------------------------------------------
  - snp-sites=2.5.1

  # --- stage 12: GWAS -------------------------------------------------------
  - pyseer=1.1.2

  # --- general --------------------------------------------------------------
  - git=2.55.0
  - jq=1.8.2
