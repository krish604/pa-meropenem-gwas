#!/usr/bin/env bash
# ---------------------------------------------------------------------------
# run.conf -- the single place to configure a 900-isolate run.
#
# Every value here is read by scripts/hpc/run_all.sh. Nothing about the machine
# is hard-coded anywhere else: change it here, not in the scripts.
# ---------------------------------------------------------------------------

# --- scheduler --------------------------------------------------------------
# Schedulers understood by scripts/hpc/submit_slurm.sh: slurm | sge | pbs | none
# "none" runs each phase in the foreground of the current shell.
SCHEDULER="${SCHEDULER:-slurm}"

# --- compute ----------------------------------------------------------------
# Cores handed to Snakemake for the DAG. Rules themselves receive this many
# threads too. For 900 isolates on a 32-core node this is the realistic value:
# stages loop over isolates serially, so extra cores mainly help the few
# rules that thread internally.
CORES="${CORES:-32}"

# Memory ceiling requested from the scheduler, in GB. Stage 8 (gubbins) and
# stage 7 (panaroo) are the hungry ones; stage 14 peaks near 3 GB by
# measurement. Do not set this below 64 for a 900-isolate cohort.
MEM_GB="${MEM_GB:-64}"

# Wall-clock per phase, HH:MM:SS.
TIME_PHASE1="${TIME_PHASE1:-24:00:00}"
TIME_PHASE2="${TIME_PHASE2:-24:00:00}"

# --- cohort -----------------------------------------------------------------
# Number of isolates you intend to analyse. scripts/hpc/check_inputs.sh fails if
# the sample list contains a different number of *unique* isolates, so a
# truncated or duplicated download is caught before compute starts.
EXPECTED_ISOLATES="${EXPECTED_ISOLATES:-900}"

# --- pipeline location ------------------------------------------------------
# This runner used to live in its own repository and drove the pipeline from a
# sibling clone. It now sits INSIDE the pipeline, so the pipeline root is two
# levels up from here (scripts/hpc -> repo root) and no second clone is needed.
# Override only if you are driving a pipeline checked out somewhere else:
#
#     PIPELINE_DIR=/scratch/pa-amr-gwas-pipeline scripts/hpc/run_all.sh
PIPELINE_DIR="${PIPELINE_DIR:-$(cd "$REPO_ROOT/../.." && pwd)}"

# --- reference databases ----------------------------------------------------
# Directory holding BaktaDB and the AMRFinderPlus database. Defaults to the
# db/ folder inside the pipeline clone, which is where README provisions them.
PIPELINE_DB_DIR="${PIPELINE_DB_DIR:-$PIPELINE_DIR/db}"

# --- configuration selects the machine ---------------------------------------
# Passed straight to `snakemake --config machine=...`. This is the ONLY place
# machine-specific thread/memory numbers are chosen (config/machines/*.yaml).
#
# NOTE: every committed overlay sets runtime.allow_real_mode to false. This
# runner exports PIPELINE_ALLOW_REAL_MODE=1 to authorise the run for one
# session without editing a tracked file -- see scripts/hpc/lib.sh:open_real_mode.
# bigmachine carries no sample cap; laptop refuses above 20 isolates.
MACHINE="${MACHINE:-bigmachine}"

# --- result root ------------------------------------------------------------
# Every byte the run writes goes under this directory, relative to the repo
# root. It is exported as PIPELINE_RESULTS_ROOT, which the pipeline reads
# instead of its own default path.
RESULTS_DIR="${RESULTS_DIR:-results}"

# --- consent file -----------------------------------------------------------
# Created by run_all.sh when you approve GWAS. scripts/hpc/run_gwas.sh refuses
# to run without it, so the gate cannot be skipped by re-invoking the step
# directly.
CONSENT_FILE="${CONSENT_FILE:-results/.gwas-consent}"
